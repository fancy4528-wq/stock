[project]
name = "quantagent"
version = "0.1.0"
description = "AI investment research system (A-share first)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars",
    "pandas",
    "numpy",
    "pyarrow",
    "duckdb",
    "psycopg[binary,pool]",
    "sqlalchemy",
    "alembic",
    "redis",
    "akshare",
    "tushare",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "fastapi",
    "uvicorn[standard]",
    "apscheduler",
    "httpx",
    "tenacity",
    "structlog",
    "scipy",
    "statsmodels",
    "lightgbm",
    "scikit-learn",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "hypothesis",
    "mypy",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
