# MVP A-share pool bootstrap (explicit symbols until rule engine lands).
# Rule intent documented in docs/11-mvp.md §3; this list is a temporary seed
# so live daily reports / Shadow can run against real PIT prices.

code: mvp_cn_50
name: MVP A股50
market: CN
rule:
  base: csi300
  note: bootstrap_symbols until rule-generated snapshots exist
  filters:
    - list_days >= 750
    - avg_amount_20d >= 100000000
    - not is_st
    - not is_suspended
  industry_coverage:
    min_industries: 10
    max_per_industry: 8
  select:
    method: top_by_market_cap
    total: 50
  snapshot_frequency: monthly

