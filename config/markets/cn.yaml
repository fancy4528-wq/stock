# A-share market rules (MVP subset for W7). Matching uses bar flags; limits are reference.
market: CN
name: "中国 A 股"
timezone: Asia/Shanghai
currency: CNY

sessions:
  - { start: "09:30", end: "11:30" }
  - { start: "13:00", end: "15:00" }
has_pre_market: false
has_post_market: false

settlement: T+1
same_day_sell_allowed: false
allow_day_trade: false

price_limit:
  enabled: true
  rules:
    - condition: is_st
      limit_up: 0.05
      limit_down: -0.05
    - condition: "board in ['star','gem']"
      limit_up: 0.20
      limit_down: -0.20
    - condition: "board == 'bse'"
      limit_up: 0.30
      limit_down: -0.30
    - condition: default
      limit_up: 0.10
      limit_down: -0.10

min_lot_buy: 100
min_lot_buy_by_board:
  main: 100
  gem: 100
  star: 200
  bse: 100
lot_increment_by_board:
  main: 100
  gem: 100
  star: 1
  bse: 1
min_lot_sell: 1
odd_lot_sell_all_at_once: true
allow_fractional: false

short_selling_allowed: false
margin_allowed: false

fees:
  commission_rate: 0.00025
  commission_min: 5.0
  stamp_duty_buy: 0.0
  stamp_duty_sell: 0.001
  transfer_fee_rate: 0.00001

slippage:
  model: volume_share
  fixed_bps: 10.0
  max_volume_share: 0.05

industry_taxonomy: sw_2021
has_theme_sectors: true

calendar_source: akshare
benchmark_symbol: "000300.SH"
